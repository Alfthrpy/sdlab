name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate tickets, registry, curriculum, content
        run: python scripts/validate.py
      - name: BOARD.md is up to date
        run: python scripts/board.py --check
