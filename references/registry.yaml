    status: candidate
    notes: "NO-AUTHOR: corporate postmortem. NO-DATE: the page shows no publication date; the page says the event started 2025-10-19 23:48 PDT and ended 2025-10-20 14:20 PDT, but its own timeline shows Redshift recovering last, with impaired clusters restored only by 2025-10-21 04:05 PDT (so the stated end time understates the tail). ECS, EKS, and Fargate were recovered by 14:20 PDT but were not the last services. Footer: (c) 2026 AWS, all rights reserved. Mechanism: race between two DNS Enactors left an empty DNS record for the DynamoDB regional endpoint; then EC2 DropletWorkflow Manager congestive collapse, network-state propagation backlog, and NLB health-check failover that removed capacity. Recovery needed manual throttling and disabling automatic failover. Candidate for incident pack P1-046. Notes: references/notes/aws-pes-dynamodb-2025-10.md."

