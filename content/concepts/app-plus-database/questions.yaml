questions:
  - id: app-plus-database-q01
    type: estimate
    difficulty: 2
    objective: 1
    prompt: "Sebuah aplikasi punya 30.000 pengguna aktif per hari, dan tiap pengguna rata-rata mengirim 50 request per hari. Penggunanya hampir semua berada di satu zona waktu, jadi kamu memakai peak-to-mean ratio 3. Berapa perkiraan RPS puncaknya?"
    unit: "RPS"
    answer:
      min: 50
      max: 54
    explanation: "30.000 x 50 = 1.500.000 request per hari; dibagi 86.400 detik sekitar 17,4 RPS rata-rata; dikali 3 sekitar 52 RPS. Kalau berhenti di rata-rata kamu mendapat 17,4, dan kalau membagi dengan 100.000 detik kamu mendapat 45."
    sources: [robustperception-peak-to-mean-ratio]
    targets_misconception: average-is-enough

  - id: app-plus-database-q02
    type: mcq
    difficulty: 2
    objective: 1
    prompt: "Sebuah aplikasi menerima 5.000.000 request per hari dari pengguna di berbagai belahan dunia. Dari pengujian (angka hipotetis), satu databasemu terbukti sanggup melayani 80 RPS. Dengan peak-to-mean ratio 1,7, apakah satu database itu masih cukup?"
    options:
      - "Cukup, karena rata-rata harian sekitar 58 RPS, dan angka itu masih di bawah kapasitas 80 RPS"
      - "Belum cukup, karena puncak dengan rasio 1,7 sekitar 98 RPS, di atas 80"
      - "Belum cukup, karena kapasitas database harus melebihi total harian sebesar 5 juta request"
      - "Cukup, karena rata-rata sekitar 58 RPS dibagi rasio 1,7 menjadi sekitar 34 RPS"
    answer: 1
    explanation: "5.000.000 dibagi 86.400 detik sekitar 58 RPS rata-rata, dan dikali 1,7 menjadi sekitar 98 RPS puncak, lebih besar dari 80. Opsi A membandingkan rata-rata dengan kapasitas, padahal database harus sanggup di jam puncak."
    sources: [robustperception-peak-to-mean-ratio]
    targets_misconception: average-is-enough

  - id: app-plus-database-q03
    type: mcq
    difficulty: 3
    objective: 1
    prompt: "Hitungan tokomu menghasilkan puncak sekitar 70 RPS. Temanmu berkata bahwa Stack Overflow melayani rata-rata sekitar 2.400 RPS pada satu hari di 2016, jadi satu mesin pasti cukup untuk tokomu. Bagaimana menilai perbandingan itu?"
    options:
      - "Beban request mereka jauh di atas 70 RPS, tapi di perangkat keras besar dengan banyak server, jadi bukan bukti satu mesin cukup"
      - "Beban request mereka jauh di atas 70 RPS di perangkat keras besar, jadi satu mesin biasa sudah cukup tanpa perlu diukur lagi di tempatmu"
      - "Beban database mereka sebenarnya kecil karena hampir semua bacaan dilayani cache, jadi perbandingan itu tidak menunjukkan apa-apa"
      - "Perbandingan itu tidak relevan karena mereka memakai SQL Server, sedangkan databasemu nanti memakai produk yang lain lagi"
    answer: 0
    explanation: "Mereka melayani request jauh di atas 70 RPS, dan primary databasenya ditopang perangkat keras besar, cache Redis, dan banyak web server, jadi angka itu tidak membuktikan satu mesin biasa cukup. Opsi B salah karena angka milik orang lain tidak menggantikan pengukuran databasemu sendiri."
    sources: [craver-stack-overflow-architecture-2016]
    targets_misconception: one-db-is-toy

  - id: app-plus-database-q04
    type: match
    difficulty: 1
    objective: 1
    prompt: "Cocokkan tiap langkah dalam hitungan kapasitas dengan operasinya."
    pairs:
      - ["Pengguna aktif harian menjadi request per hari", "Kalikan dengan rata-rata request per pengguna"]
      - ["Request per hari menjadi RPS rata-rata", "Bagi dengan jumlah detik dalam sehari"]
      - ["RPS rata-rata menjadi RPS puncak", "Kalikan dengan peak-to-mean ratio"]
      - ["RPS puncak dibandingkan dengan kapasitas", "Pakai kapasitas database yang sudah kamu ukur sendiri"]
    explanation: "Urutannya pengguna, request per hari, RPS rata-rata, RPS puncak, lalu perbandingan dengan kapasitas. Kesalahan umum adalah melewatkan peak-to-mean ratio dan membandingkan rata-rata dengan kapasitas."
    sources: [robustperception-peak-to-mean-ratio]
    targets_misconception: average-is-enough

  - id: app-plus-database-q05
    type: estimate
    difficulty: 2
    objective: 1
    prompt: "Monitoring sebuah situs mencatat 4.320.000 request dalam sehari, dan grafiknya menunjukkan puncak 120 RPS. Berapa peak-to-mean ratio situs itu?"
    unit: "kali"
    answer:
      min: 2.3
      max: 2.5
    explanation: "4.320.000 dibagi 86.400 detik tepat 50 RPS rata-rata, jadi rasionya 120 / 50 = 2,4. Kalau kamu membagi dengan 100.000 detik, rata-ratanya 43,2 dan rasionya 2,8. Nilai 2,4 lebih tinggi dari 1,6 sampai 1,7 untuk pengguna global, wajar kalau penggunanya terkonsentrasi di satu zona waktu."
    sources: [robustperception-peak-to-mean-ratio]
    targets_misconception: average-is-enough

  - id: app-plus-database-q06
    type: mcq
    difficulty: 2
    objective: 1
    prompt: "Puncak hitunganmu 70 RPS, dan databasemu sudah terukur sanggup 300 RPS (angka hipotetis). Pemilik produk juga meminta layanan tetap jalan walaupun mesin yang menjalankannya rusak. Bagaimana kesimpulan yang tepat untuk satu aplikasi dan satu database?"
    options:
      - "Cukup untuk volume dan untuk syarat layanan tetap jalan, karena puncak hanya seperempat kapasitas"
      - "Cukup untuk volume, dan syarat layanan tetap jalan terpenuhi asal database di-backup tiap malam"
      - "Belum cukup untuk volume, karena 70 RPS sudah menuntut dua database yang berbagi beban"
      - "Cukup untuk volume, tetapi syarat layanan tetap jalan saat mesin rusak butuh mesin cadangan"
    answer: 3
    explanation: "Volume 70 RPS jauh di bawah 300 RPS, tetapi satu mesin tanpa cadangan berarti satu kegagalan mematikan semuanya. Backup (opsi B) menyimpan salinan data, tidak menjaga layanan tetap jalan selama mesin rusak."
    sources: [aws-startups-scaling-part1-primer]
    targets_misconception: small-rps-means-no-risk

  - id: app-plus-database-q07
    type: multi
    difficulty: 1
    objective: 2
    prompt: "Aplikasimu berjalan sebagai satu proses dan di-restart saat deploy. Data mana yang masih ada setelah restart itu?"
    options:
      - "Baris pesanan di tabel database"
      - "Isi keranjang yang disimpan di dictionary dalam memori proses"
      - "Counter pengunjung di variabel global aplikasi"
      - "Sesi login yang disimpan di tabel database"
      - "Hasil cache yang disimpan di memori proses"
    answer: [0, 3]
    explanation: "Data di database tetap ada karena database adalah layanan terpisah dari proses aplikasi. Memori proses, termasuk dictionary, variabel global, dan cache di dalamnya, dihapus saat restart walaupun hanya ada satu proses."
    sources: [twelve-factor-app]
    targets_misconception: memory-survives-restart

  - id: app-plus-database-q08
    type: mcq
    difficulty: 2
    objective: 2
    prompt: "Setelah deploy, seorang pengguna melihat keranjangnya kosong, tetapi ia tetap login dan riwayat pesanannya lengkap. Aplikasi berjalan sebagai satu proses, dan keranjang hanya kosong setelah deploy. Penyebab yang paling mungkin?"
    options:
      - "Keranjang hanya ada di memori proses, sedangkan sesi dan pesanan ada di database"
      - "Cookie sesi di browser pengguna itu kedaluwarsa tepat saat deploy sedang berlangsung"
      - "Batas koneksi database sudah tercapai sehingga query yang membaca keranjang gagal"
      - "Tabel keranjang belum diberi index sehingga query yang membacanya melewati batas waktu"
    answer: 0
    explanation: "Hanya keranjang yang kosong sementara sesi dan pesanan utuh, jadi keranjang berada di tempat yang terhapus saat restart, yaitu memori proses. Opsi B keliru karena cookie yang kedaluwarsa akan membuat pengguna logout juga."
    sources: [twelve-factor-app]
    targets_misconception: memory-survives-restart

  - id: app-plus-database-q09
    type: mcq
    difficulty: 2
    objective: 2
    prompt: "Proses aplikasi dirancang stateless, tetapi memorinya masih boleh dipakai untuk keperluan tertentu. Mana yang paling aman disimpan hanya di memori proses?"
    options:
      - "Isi keranjang belanja pengguna yang belum checkout, karena pengguna bisa mengisinya lagi kalau hilang"
      - "Gambar yang sedang diubah ukurannya dalam satu request upload, karena hasil akhirnya ditulis ke database"
      - "Nomor urut pesanan terakhir, karena nilainya kecil dan mudah dibuat lagi kalau hilang"
      - "Penanda bahwa pengguna sudah login, karena pengguna tinggal login lagi kalau hilang"
    answer: 1
    explanation: "Gambar yang sedang diproses hanya dipakai selama satu request, dan yang harus bertahan sudah ditulis ke database. Opsi D keliru: penanda login dibutuhkan di request berikutnya, jadi hilangnya saat restart membuat semua pengguna logout."
    sources: [twelve-factor-app]
    targets_misconception: all-state-in-database
